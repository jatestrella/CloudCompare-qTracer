<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- outcrop background (matches the qTracer icon family) -->
  <rect x="3" y="5" width="26" height="23" rx="1.5" fill="#e8d8b5" stroke="#3d2f1e" stroke-width="1.4"/>
  <!-- kept (long) traces: solid red -->
  <g stroke="#b22" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="6"  y1="25" x2="15" y2="8"/>
    <line x1="12" y1="26" x2="25" y2="9"/>
    <line x1="20" y1="24" x2="27" y2="12"/>
  </g>
  <!-- filtered-out (short) traces: grey dashed -->
  <g stroke="#7a7a7a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2,2" fill="none">
    <line x1="8"  y1="11" x2="12" y2="15"/>
    <line x1="22" y1="21" x2="26" y2="25"/>
    <line x1="16" y1="19" x2="18" y2="22"/>
  </g>
</svg>
